    // The Enterprise Security API (ESAPI) project is an OWASP project to create simple strong security controls for
    // every web platform. Security controls are not simple to build. You can read about the hundreds of pitfalls for
    // unwary developers on the OWASP web site. By providing developers with a set of strong controls, we aim to
    // eliminate some of the complexity of creating secure web applications. This can result in significant cost
    // savings across the SDLC.
    //
    // ESAPI with GraalVM:
    //
    //    GraalVM provides the ability to compile JVM-based applications into native images, which gives them faster
    //    startup times and reduced memory usage. However, ESAPI uses ⚠️several reflection and dynamic features⚠️, which
    //    can pose challenges when creating native images.
    //
    //    Challenges with ESAPI and GraalVM Native Image:
    //        ⚠️Reflection and Dynamic Code⚠️: ESAPI uses reflection for many of its features, including dynamic class
    //        loading, which requires configuration in GraalVM for native images.
    //
    //        Native Image Configuration: To ensure ESAPI works correctly in a GraalVM native image, you will need to
    //        provide reflection configuration to tell GraalVM which classes and methods are accessed via reflection at
    //        runtime.
    //
    // Enabling ESAPI in GraalVM Native Image:
    //
    //    Reflection Configuration: You will need to configure GraalVM to handle reflection and dynamic code loading by
    //    specifying the required reflection configuration in your native image setup.
    //
    //        GraalVM typically requires explicit configuration of reflection, dynamic proxies, and other resources.
    //        This can be done by generating a reflection configuration file or using GraalVM's native-image-agent to
    //        automatically capture the necessary configurations.
    //
    //    Example reflection configuration might look like:
    //
    //    [
    //      {
    //        "name": "org.owasp.esapi.ESAPI",
    //        "methods": [{"name": "validator", "parameterTypes": []}],
    //        "fields": []
    //      },
    //      {
    //        "name": "org.owasp.esapi.ESAPIValidator",
    //        "methods": [{"name": "isValidInput", "parameterTypes": ["java.lang.String", "java.lang.String", "java.lang.String", "int"]}],
    //        "fields": []
    //      }
    //    ]
    //
    //    Resource Inclusion: Some ESAPI features might also need resource inclusion to be manually configured,
    //    particularly if any resources (e.g., configuration files) are dynamically loaded.
    //
    // Conclusion:
    //
    //    ESAPI with Quarkus: ESAPI can be integrated into Quarkus applications to help with security controls,
    //    including input validation, cryptography, and more. It works with Quarkus just like any other Java dependency.
    //
    //    ESAPI with GraalVM: ESAPI can also work with GraalVM, but native image compilation requires careful
    //    configuration, especially due to ESAPI's use of reflection and dynamic code. You will need to manually
    //    provide reflection configurations and handle any other dynamic features to ensure the application works in a
    //    native image.
    //
    // In general, if you're targeting GraalVM native images, you will need to account for ESAPI's dynamic features and
    // configure GraalVM to handle reflection properly. However, if you’re working in JVM mode, ESAPI should integrate
    // seamlessly with Quarkus without additional setup.
    //
    // TODO: A lot of testing.
    // TODO: Investigate where it is being used and if this could be transferred to Keycloak
    // https://mvnrepository.com/artifact/org.owasp.esapi/esapi
    implementation 'org.owasp.esapi:esapi:2.6.0.0'

