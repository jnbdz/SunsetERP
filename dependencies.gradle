    // API for Apache Log4J, a highly configurable logging tool that focuses on performance and low garbage generation.
    // It has a plugin architecture that makes it extensible and supports asynchronous logging based on LMAX Disruptor.
    //
    // Note: the API of log4j 2
    //
    // - Quarkus uses JUL (Java Util Logging) or JBoss Logging by default for logging, but it does provide support for
    //   Log4j 2 through an extension.
    // - To use Log4j 2 with Quarkus, you would need to manually add the required dependencies and configure it.
    // - Quarkus has its own logging system based on JUL, Jboss Logging, and SLF4J (Simple Logging Facade for Java)
    // - with a default logging backend that is optimized for Quarkus
    // - Quarkus provides a logging system that works well out of the box
    // - It can integrate with other logging frameworks like Log4j 2 or Logback
    //
    // - To deactivate the default logging in Quarkus: quarkus.log.console.enabled=false
    // - Log4j 2 requires configurations in XML
    //
    // Quarkus vs Log4j 2:
    // - Integrating Log4j 2 with asynchronous logging in Quarkus could indeed provide a performance boost
    // - Asynchronous logging: The logging happens without blocking the other processes
    //
    // - For a simplified and native OpenTelemetry experience, stick with Quarkus' default logging system, as it
    //   integrates directly with OpenTelemetry and offers ease of setup and cloud-native optimizations.
    // - If you need advanced logging features (e.g., asynchronous logging, complex configurations), Log4j 2 can still
    //   be used, but integrating it with OpenTelemetry requires additional effort and configuration.
    //
    // TODO: New version --> 3.0.0-beta2
    // https://mvnrepository.com/artifact/org.apache.logging.log4j/log4j-api
    implementation 'org.apache.logging.log4j:log4j-api:2.24.2'

