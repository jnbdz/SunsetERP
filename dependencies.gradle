    //    GraalVM is designed to compile JVM-based applications into native images for faster startup times and reduced
    //    memory consumption. However, NekoHTML relies on reflection, which is common in libraries that work with DOM
    //    or require dynamic class loading.
    //
    //    Reflection and Native Image: Since NekoHTML might use reflection (e.g., dynamically processing HTML elements
