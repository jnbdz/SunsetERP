    //        properly in native image mode.
    //
    //        Template Loading: FreeMarker loads templates at runtime. This dynamic behavior might require explicit
    //        configuration or inclusion of templates in the native image resources.
    //
    // Enabling FreeMarker in Native Image Mode:
    //
    //    To ensure FreeMarker works properly in a native image built with GraalVM, you may need to:
    //        Configure reflection explicitly using GraalVM’s reflection configuration.
    //        Ensure that any template files (e.g., .ftl templates) are correctly included in the native image resource
    //        configuration.
    //
    //        Use GraalVM’s native-image tool with the necessary flags to include the required classes, resources, and
