    // Clojure core environment and runtime library.
    //
    // Yes, Clojure can work with GraalVM, but there are some important considerations and limitations.
    // 1. Clojure and GraalVM Compatibility:
    //
    //    Clojure is a JVM-based language, and GraalVM is a polyglot VM that supports JVM languages, including Java,
    //    Scala, and Clojure.
    //
    //    Clojure on GraalVM should work for running Clojure code on the JVM as part of the GraalVM runtime, but you
    //    won't get the full benefits of GraalVM’s native image features out of the box, because Clojure relies heavily
    //    on dynamic features like reflection and runtime code evaluation.
    //
    // 2. Challenges with Native Image:
    //
    //    One of the key features of GraalVM is its ability to compile JVM applications into native images, which are
    //    optimized for faster startup times and reduced memory consumption. However, Clojure’s dynamic nature
    //    (e.g., reflection, macros, and runtime code evaluation) can cause issues with native image generation.
    //
    //    GraalVM's Native Image requires you to explicitly configure which parts of the application need to be
    //    included in the native image, and dynamic languages like Clojure often require additional reflection
    //    configuration to work properly.
    //
    // 3. Possible Setup:
    //
    //    You can still run Clojure on GraalVM in the JVM mode without the native image benefits. This will give you
    //    the ability to run Clojure code in the GraalVM environment.
    //
    //    If you're aiming for a native image (e.g., reduced memory footprint and fast startup), you'll need to handle
    //    Clojure’s dynamic features carefully. This might involve:
    //        Configuration for Reflection: Using GraalVM's reflection configuration to tell GraalVM which classes and
    //        methods should be included in the native image.
    //
    //        Workarounds for Dynamic Features: Clojure’s dynamic nature means you may need to provide additional
    //        hints for GraalVM to handle code that’s evaluated at runtime.
    //
    // 4. Recent Developments:
    //
    //    The GraalVM community has been working on improving native image support for dynamic languages, but Clojure
    //    is still not as well-supported as Java or other static languages when it comes to native images. Some tools
    //    and frameworks around Clojure may not work seamlessly with GraalVM native images without additional work.
    //
    // Conclusion:
    //
    //    Yes, Clojure can work with GraalVM, but native image support is more complicated due to Clojure's dynamic
    //    nature. You will likely need to configure GraalVM to handle reflection and other dynamic behaviors for native
    //    image generation. For JVM execution, Clojure should work fine within the GraalVM environment.
    //
    // https://mvnrepository.com/artifact/org.clojure/clojure
