    // Groovy: A powerful multi-faceted language for the JVM
    //
    // Groovy can work with GraalVM, but there are some considerations regarding its integration with GraalVM native
    // images.
    //
    // 1. Groovy and GraalVM Compatibility:
    //
    //    Groovy is a JVM-based language and, as such, it can run on the JVM provided by GraalVM without issues. Groovy
    //    can be executed in JVM mode on GraalVM as part of the JVM runtime environment.
    //
    //    Groovy on GraalVM Native Image: Similar to Clojure, Groovy's dynamic nature (e.g., dynamic typing, runtime
    //    method calls, metaprogramming, etc.) poses challenges when it comes to native image compilation. GraalVM’s
    //    native image feature works best with static languages and languages with predictable class structures.
    //    Groovy's dynamic features, such as reflection and runtime code generation, require careful configuration to
    //    work well with GraalVM's native image generation.
    //
    // 2. Challenges with Native Image:
    //
    //    Dynamic Features: Groovy relies heavily on runtime reflection and metaprogramming (e.g., dynamic method
    //    invocation, runtime class creation, etc.). These features make it difficult for GraalVM to statically analyze
    //    the code, which is necessary for native image generation.
    //
    //    Reflection Configuration: In order to generate a native image of a Groovy application with GraalVM, you need
    //    to manually configure which parts of the Groovy runtime and application code should be included in the native
    //    image. This usually involves specifying which classes and methods are accessed via reflection, because
    //    GraalVM needs explicit configuration to include these classes at compile-time.
    //
    //    GraalVM Support for Groovy: Groovy itself is not natively supported by GraalVM's native image feature as well
    //    as languages like Java. However, with proper configuration, it is possible to create native images for Groovy
    //    applications, but the process may require more effort than using a static language like Java.
    //
    // 3. Working with Groovy in GraalVM:
    //
    //    JVM Mode: Groovy will work out of the box with GraalVM in JVM mode. This means you can run Groovy code using
    //    GraalVM's JVM runtime, which offers benefits such as polyglot support and the ability to run multiple
    //    languages like Java, JavaScript, Python, and Groovy in the same environment.
    //
    //    Native Image Mode: For native image generation, Groovy may require additional configuration. Specifically,
    //    you will need to:
    //        Provide Reflection Configuration: You need to specify in configuration files which methods and classes
    //        need to be accessible at runtime via reflection. This can be a complex task, especially if Groovy uses
    //        many dynamic features in the application.
    //
    //        Use GraalVM's SubstrateVM: Groovy needs to be compatible with SubstrateVM, which is the part of
    //        GraalVM responsible for native image generation. It may require additional dependencies or workarounds to
    //        fully support Groovy’s dynamic features.
    //
    // 4. Groovy 5.x (Alpha Version):
    //
    //    Groovy 5.0 is in alpha and introduces significant changes to the language. It may come with updates that
    //    improve its compatibility with GraalVM, but as of now, native image support for Groovy remains challenging
    //    due to the dynamic nature of the language.
    //
    // 5. Alternative Approaches:
    //
    //    Static Groovy Compilation: For Groovy, it's possible to use static compilation to reduce the reliance on
    //    dynamic features. This may make it easier to work with GraalVM's native image. Static Groovy compilation can
    //    help with some of the reflection and metaprogramming challenges, but it might not completely eliminate them.
    //
    // Conclusion:
    //
    //    Groovy will work on GraalVM in JVM mode without issues, and you can run Groovy code within the GraalVM
    //    environment as part of the JVM-based runtime.
    //
    //    For native image generation, you can create a native image for Groovy applications, but it requires manual
    //    configuration to handle dynamic features like reflection and metaprogramming.
    //        The process is more complicated compared to static languages like Java, and may require specifying
    //        reflection configuration and other adjustments to ensure proper functionality in a native image.
    //
    // If your goal is to use GraalVM native images, Groovy might require extra work, and you may need to manage its
    // dynamic features carefully. However, if you're working with Groovy in JVM mode, GraalVM is a suitable and
    // powerful environment for running Groovy alongside other languages.
    //
    // TODO: New version --> 5.0.0-alpha-12
    // https://mvnrepository.com/artifact/org.apache.groovy/groovy-all
    implementation 'org.apache.groovy:groovy-all:5.0.0-alpha-11'

